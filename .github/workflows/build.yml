name: build
# Builds the rules daily and publishes them to the dist branch when they changed.

on:
  schedule:
    - cron: "17 23 * * *"   # daily, 23:17 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and check
        run: ./build.sh out
      - name: Publish to the dist branch (only if the rules changed)
        run: ./publish.sh out
